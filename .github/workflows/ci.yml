name: CI

on:
  push:
  pull_request:

jobs:
  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run test:db
      - run: npm run build
        env:
          SUPABASE_URL: https://example.supabase.co
          SUPABASE_SERVICE_ROLE_KEY: test-service-role-key
          ADMIN_PASSWORD_HASH: pbkdf2_sha256:210000:dGVzdHNhbHQ:AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA
          SESSION_SECRET: test-session-secret-with-at-least-32-characters
          AGENT_TOKEN_HASH: aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa

  agent:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m unittest discover -s pc-agent/tests -v
      - run: python -m pip install pyinstaller
      - run: ./pc-agent/build-exe.ps1
      - uses: actions/upload-artifact@v4
        with:
          name: ydown-windows-core-1.0
          path: |
            pc-agent/dist/ydown.exe
            pc-agent/dist/.env.example
            pc-agent/dist/start-ydown.cmd
            pc-agent/dist/install-startup.ps1
            pc-agent/dist/uninstall-startup.ps1
            pc-agent/dist/SETUP_GUIDE_KO.md
            pc-agent/dist/search.sql
          include-hidden-files: true
          if-no-files-found: error
